services:
  postgres:
    image: postgres:16-alpine
    container_name: chaibooklm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chaibooklm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - chaibooklm-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chaibooklm-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - chaibooklm-redis-data:/data

volumes:
  chaibooklm-postgres-data:
  chaibooklm-redis-data:
